name: Unduh Histori untuk Analisa

on:
  push:
    branches: [claude/peaceful-hopper-uilps8]
    paths: [".github/workflows/unduh_histori.yml", "tools/unduh_histori.py"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  unduh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: python tools/unduh_histori.py 2y
      - name: Commit hasil ke branch ini
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add data/analisa/
          git diff --cached --quiet || git commit -m "chore: histori 2 tahun untuk analisa (sementara)"
          git push
